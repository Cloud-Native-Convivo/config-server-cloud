services:
  config-server:
    build: .
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - convivo-network
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native

networks:
  convivo-network:
    external: true
    name: convivo-network
