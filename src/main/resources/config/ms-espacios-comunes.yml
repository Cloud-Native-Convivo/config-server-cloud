# ms-espacios-comunes (FastAPI) - Configuración centralizada servida por config-server
# Consumida en arranque por app.config.settings.cargar_configuracion_remota

server:
  port: 8082

db:
  host: localhost
  port: 1521
  name: FREEPDB1
  username: admin

rabbitmq:
  host: localhost
  port: 5672
  usuario: ${RABBITMQ_USER:guest}
  contrasena: ${RABBITMQ_PASSWORD}

eureka:
  url: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD}@localhost:8761/eureka/
  ip: 127.0.0.1
  port: 8082

modo-debug: false

cors:
  origins: ["http://localhost:4200", "http://127.0.0.1:4200"]
