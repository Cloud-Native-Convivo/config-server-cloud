# bff (NestJS) - Configuración centralizada servida por config-server
port: 3000
global-prefix: api
service-name: convivo-bff

eureka:
  url: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD}@localhost:8761/eureka/
  services:
    gastos: MS-GASTOS-COMUNES
    espacios: MS-ESPACIOS-COMUNES

proxy:
  timeout-ms: 2000

rabbitmq:
  enabled: true
  urls: amqp://${RABBITMQ_USER:guest}:${RABBITMQ_PASSWORD}@localhost:5672
  exchange: espacios_events
  queue: convivo.gastos.inbox
