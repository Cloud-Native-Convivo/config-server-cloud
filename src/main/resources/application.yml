spring:
  application:
    name: config-server
  security:
    user:
      name: ${CONFIG_SERVER_USER:config_user}
      password: ${CONFIG_SERVER_PASSWORD:secret_password}
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

server:
  port: 8888
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: config-server

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
